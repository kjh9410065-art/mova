name: NERDING deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # 배포에 필요한 두 개의 GitHub Secret이 비어 있으면 배포 전에 즉시 실패시킵니다.
      - name: Verify Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Next.js 정적 사이트를 ./out에 생성합니다.
      - name: Build Next.js export
        run: npm run build

      # wrangler.jsonc의 Worker 설정에 따라 Cloudflare Workers에 배포합니다.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 배포 성공과 실제 공식 도메인의 가용성을 별도로 검증합니다.
      # Cloudflare DNS·인증서가 없으면 실패 원인을 명확하게 표시합니다.
      - name: Verify official NERDING domain
        run: |
          set -euo pipefail
          BASE="https://nerding.tcflick.com"

          echo "DNS lookup for nerding.tcflick.com"
          if ! getent ahosts nerding.tcflick.com; then
            echo "::error::nerding.tcflick.com DNS is not configured or not yet propagated. Check Cloudflare custom domain settings."
            exit 1
          fi

          check_text() {
            local url="$1" needle="$2" outfile="$3"
            echo "Checking $url"
            if ! curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --connect-timeout 10 --max-time 45 "$url" -o "$outfile"; then
              echo "::error::Request failed: $url. Check Workers custom domain, DNS, SSL, and routes."
              return 1
            fi
            if ! grep -Fq "$needle" "$outfile"; then
              echo "::error::Missing required content in $url: $needle"
              return 1
            fi
            echo "Passed: $url"
          }

          check_text "$BASE/" "NERDING" /tmp/nerding.html
          check_text "$BASE/" "https://nerding.tcflick.com/" /tmp/nerding-home-url.html
          check_text "$BASE/robots.txt" "Sitemap: $BASE/sitemap.xml" /tmp/nerding-robots.txt
          check_text "$BASE/llms.txt" "NERDING" /tmp/nerding-llms.txt
          check_text "$BASE/sitemap.xml" "<urlset" /tmp/nerding-sitemap.xml
          grep -Fq "$BASE/" /tmp/nerding-sitemap.xml

          # Check important user-facing pages, not just the homepage.
          check_text "$BASE/catalog" "NERDING" /tmp/nerding-catalog.html
          check_text "$BASE/recommend" "NERDING" /tmp/nerding-recommend.html
          check_text "$BASE/compare" "NERDING" /tmp/nerding-compare.html
          check_text "$BASE/tools/url" "URL" /tmp/nerding-url.html
          check_text "$BASE/guides/ai-image-generator" "AI 이미지" /tmp/nerding-guide.html
          check_text "$BASE/services/openai" "OpenAI" /tmp/nerding-service.html
          check_text "$BASE/favorites" "즐겨찾기" /tmp/nerding-favorites.html
          if grep -Eq "https://mova[.]tcflick[.]com" /tmp/nerding-catalog.html; then
            echo "::error::Catalog still links to the retired MOVA hostname."
            exit 1
          fi
          echo "Official NERDING domain checks passed."
