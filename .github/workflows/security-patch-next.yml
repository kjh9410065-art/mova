name: NERDING one-time Next.js security patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-patch-next.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-next:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Update vulnerable Next.js 16.4.0 to patched 16.4.3
        run: npm install --save-exact --no-audit next@16.4.3
      - name: Verify Next.js version and lockfile
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); const lock=JSON.parse(fs.readFileSync("package-lock.json")); if(p.dependencies.next!=="16.4.3"||lock.packages["node_modules/next"].version!=="16.4.3")process.exit(1);console.log("Next.js 16.4.3 verified in manifest and lockfile")'
      - name: Check production dependency advisories
        run: |
          npm audit --omit=dev --json > /tmp/nerding-audit.json || true
          node --input-type=module -e 'import fs from "node:fs"; const j=JSON.parse(fs.readFileSync("/tmp/nerding-audit.json"));const bad=Object.entries(j.vulnerabilities||{}).filter(([name,v])=>v.severity==="critical"||v.severity==="high");for(const [n,v] of bad)console.log(n,v.severity);if(bad.length){console.error("High/critical advisories remain: "+bad.length);process.exit(1)} console.log("No high/critical production dependency audit findings")'
      - name: Rebuild and rerun catalog, search, SEO and search-focus checks
        run: npm run build
      - name: Commit only dependency security changes after passing tests
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Already on the patched dependency version."
            exit 0
          fi
          git commit -m "security: upgrade Next.js to patched 16.4.3"
          git pull --rebase origin main
          git push origin HEAD:main
