name: NERDING isolated preview
on:
  push:
    branches: ['preview/all-features-20261026']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate offline AI workflow preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/feature-preview.html').read_text()
          for term in ['id="catalog"','id="stack"','id="budget"','id="history"','koreanVerified','commercialVerified','noindex,nofollow','@media(max-width:599px)']:
              assert term in p,term
          print('NERDING preview source checks passed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nerding-feature-preview
          path: public/feature-preview.html
          retention-days: 14
