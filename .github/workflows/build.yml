name: NERDING build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 커밋된 잠금 파일로 동일한 의존성을 설치합니다.
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js export
        run: npm run build
